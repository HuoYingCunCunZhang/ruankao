<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>知识网 · 系统集成项目管理工程师</title>
<style>
:root{
  --ink:#1a2233; --ink2:#5a6478; --ink3:#8a93a6; --line:#e6eaf2;
  --bg:#eef1f7; --card:#ffffff; --brand:#16324f; --accent:#f59e0b;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 30px rgba(20,30,60,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
}

/* 画布铺满视口；touch-action:none 保证手机端拖动/缩放不被浏览器滚动手势抢走 */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}

/* ---- top bar ---- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));
  background:linear-gradient(135deg,#16324f,#1f4e7a);color:#fff;box-shadow:var(--shadow)}
.topbar .back{flex:none;width:34px;height:34px;border-radius:9px;border:none;background:rgba(255,255,255,.14);
  color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.topbar .title{flex:1;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ibtn{flex:none;height:34px;padding:0 11px;border-radius:9px;border:none;
  background:rgba(255,255,255,.14);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}

/* ---- legend（不拦截点击） ---- */
.legend{position:fixed;top:calc(52px + env(safe-area-inset-top));left:0;right:0;z-index:12;
  display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;pointer-events:none;justify-content:center}
.legend .lg{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:11px;color:var(--ink2)}
.legend .dot{width:9px;height:9px;border-radius:3px;flex:none}

/* ---- hint ---- */
.hint{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:11;
  background:rgba(22,50,79,.92);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;
  pointer-events:none;transition:opacity .5s;white-space:nowrap;max-width:78vw;overflow:hidden;text-overflow:ellipsis}
.hint.hide{opacity:0}

/* ---- floating controls ---- */
.ctrls{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;gap:8px}
.ctrls button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:19px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.ctrls button:active{transform:scale(.94)}
.detailbtn{position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;display:none;
  align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;border:none;
  background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.detailbtn.show{display:flex}

/* ---- search overlay ---- */
.search{position:fixed;top:calc(48px + env(safe-area-inset-top));left:0;right:0;z-index:28;padding:8px 10px;display:none}
.search.open{display:block}
.search .box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px;padding:9px 0;color:var(--ink)}
.search .res{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;
  box-shadow:var(--shadow);max-height:52vh;overflow:auto;display:none}
.search .res .r{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.search .res .r:last-child{border-bottom:none}
.search .res .r .tag{font-size:10.5px;color:var(--ink3);margin-left:6px}
.search .res .r:active{background:var(--line)}
.search .empty{padding:18px;text-align:center;color:var(--ink3);font-size:13px}

/* ---- detail panel ---- */
.panel{position:fixed;z-index:24;background:var(--card);box-shadow:var(--shadow);
  border:1px solid var(--line);overflow:auto;display:none}
.panel.open{display:block}
.panel .phead{position:sticky;top:0;background:var(--card);z-index:2;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.panel .phead .pt{font-size:17px;font-weight:700;line-height:1.4;padding-right:34px}
.panel .phead .psub{font-size:12px;color:var(--ink3);margin-top:3px}
.panel .pclose{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;border:none;
  background:var(--line);color:var(--ink2);font-size:16px;cursor:pointer}
.panel .pbody{padding:14px 16px 30px}
.panel .sec{margin-bottom:18px}
.panel .sec .h{font-size:13.5px;font-weight:700;margin-bottom:8px}
.panel .logic{font-size:13px;line-height:1.7;color:var(--ink)}
.panel .logic h1,.panel .logic h2,.panel .logic h3,.panel .logic h4{margin:14px 0 6px;line-height:1.4}
.panel .logic h3{font-size:14px;color:var(--brand)}
.panel .logic p{margin:6px 0}
.panel .logic ul,.panel .logic ol{margin:6px 0;padding-left:20px}
.panel .logic li{margin:3px 0}
.panel .logic strong{color:var(--ink)}
.panel .chip{display:inline-block;background:#f1f5fb;border:1px solid var(--line);color:var(--ink2);
  border-radius:8px;padding:3px 8px;font-size:12px;margin:0 5px 6px 0}
.panel .chip.on{background:#fde68a;border-color:#f0c040;color:#7a4f00;font-weight:600}
.panel .chip[data-sub]{cursor:pointer}
.panel .chip[data-sub]:hover{border-color:var(--brand);color:var(--brand)}
.panel .postag{background:#fdf3e3;border-left:3px solid #d97706;border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:13px;margin-bottom:14px;line-height:1.65}
.panel .postag b{color:#b45309}
.panel mark.hit{background:#fde68a;color:inherit;border-radius:3px;padding:0 2px;font-weight:700}
.panel .logic table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px;display:block;overflow-x:auto}
.panel .logic th,.panel .logic td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.panel .logic th{background:#f1f5fb;font-weight:700;white-space:nowrap}
.panel .logic tr:nth-child(even) td{background:#fafbfd}
.panel .logic blockquote{margin:8px 0;padding:8px 12px;background:#f1f5fb;border-left:3px solid var(--line);border-radius:0 8px 8px 0}
.panel .logic hr{border:none;border-top:1px dashed var(--line);margin:12px 0}
.panel .logic code{background:#f1f5fb;padding:1px 5px;border-radius:4px;font-size:.92em}
.panel .mapline{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.panel .mapline:last-child{border-bottom:none}
.panel .mapline .mt{flex:none;font-size:12.5px;font-weight:700;color:var(--brand);width:44%}
.panel .mapline .mc{flex:1;font-size:12px;color:var(--ink2);line-height:1.6}
.panel .srow{display:flex;gap:8px;align-items:baseline;padding:5px 0;font-size:12.5px;border-bottom:1px dotted var(--line)}
.panel .srow:last-child{border-bottom:none}
.panel .srow .sn{flex:none;color:var(--brand);font-weight:700;width:42px}
.panel .srow .st{flex:1;color:var(--ink)}
.panel .btnline{margin-top:14px}
.panel .openbtn{display:block;width:100%;text-align:center;padding:12px;border-radius:10px;border:none;
  background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}

@media (min-width:701px){
  .panel{top:calc(48px + env(safe-area-inset-top));right:12px;bottom:12px;width:400px;border-radius:14px}
  body.panelopen .ctrls{right:426px}
}
  @media (max-width:700px){
  .panel{left:0;right:0;bottom:0;max-height:58vh;border-radius:16px 16px 0 0}
  body.panelopen .ctrls{display:none}
  .topbar .title{font-size:14px}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html" title="返回应用">‹</a>
  <div class="title" id="topTitle">知识网 · 系统集成项目管理工程师</div>
  <button class="ibtn" id="searchBtn">🔍</button>
  <button class="ibtn" id="modeBtn">🕸️</button>
</div>

<div class="legend" id="legend"></div>
<div class="hint" id="hint">点部分展开 · 点章节聚焦 · 拖动平移</div>

<canvas id="cv"></canvas>

<button class="detailbtn" id="detailBtn">📖 本章详情</button>

<div class="ctrls">
  <button id="zoomIn" title="放大">＋</button>
  <button id="zoomOut" title="缩小">－</button>
  <button id="fitBtn" title="重置视角">⌂</button>
  <button id="backBtn" title="返回总览">↩</button>
</div>

<div class="search" id="search">
  <div class="box">
    <input id="searchInput" placeholder="搜索章节 / 知识点 / 考点…" autocomplete="off">
    <button id="searchClose" style="border:none;background:none;font-size:16px;color:var(--ink3);cursor:pointer">✕</button>
  </div>
  <div class="res" id="searchRes"></div>
</div>

<div class="panel" id="panel"></div>

<script src="content.js"></script>
<script>
(function(){
"use strict";
var D = window.COURSE_DATA || {title:"",modules:[]};

/* ================= palette ================= */
var INK = "#1a2233", MUTED = "#8a93a6";
var MOD = {
  m1:{ main:"#1f6feb", soft:"#e9f1fe", line:"#a9c6f5", deep:"#154f9e", name:"IT技术基础" },
  m2:{ main:"#0e9f9f", soft:"#dcf3f2", line:"#8fd5d1", deep:"#0a6e6e", name:"项目管理核心" },
  m3:{ main:"#e07b00", soft:"#fdf0dc", line:"#f2c98b", deep:"#a85c00", name:"组织与支撑" }
};
var ROOTC = { main:"#16324f", deep:"#0f2338" };

/* ================= build graph ================= */
var nodes = [], byId = {}, edges = [];
function N(o){ nodes.push(o); byId[o.id]=o; return o; }
function E(a,b){ edges.push({a:a, b:b}); }

// 把「知识点(map item)」映射到对应的「小节(section)」，供右侧面板展示
function sectionForMapItem(c, mi){
  var secs = c.sections || [];
  var m = /[(（]\s*(\d+(?:\.\d+)*)/.exec(mi.t || "");   // 支持 "13.1-13.3" 取首个 13.1
  var num = m ? m[1] : null;
  if(num){
    for(var i=0;i<secs.length;i++){ if(String(secs[i].num) === num) return secs[i]; }
    for(var j=0;j<secs.length;j++){
      var sn = String(secs[j].num||"");
      if(sn && (sn.indexOf(num) === 0 || num.indexOf(sn) === 0)) return secs[j];
    }
  }
  var t = String(mi.t || "").replace(/[（(].*?[)）]/g, "").trim();
  if(t){
    for(var k=0;k<secs.length;k++){
      var st = String(secs[k].title || "");
      if(st && (st.indexOf(t) >= 0 || t.indexOf(st) >= 0)) return secs[k];
    }
  }
  return null;
}
// 中文二元组，用于按正文命中率定位小节
function bigrams(s){
  var out = [], t = String(s||"");
  for(var i=0;i<t.length-1;i++){
    var a = t.charCodeAt(i), b = t.charCodeAt(i+1);
    if(a>=0x4e00 && a<=0x9fa5 && b>=0x4e00 && b<=0x9fa5) out.push(t.substr(i,2));
  }
  return out;
}
// 第五级考点：先按考点名匹配小节标题，再按「标题权重+正文命中」挑最相关的小节
function sectionForSub(c, label, fallback){
  var secs = c.sections || [];
  var t = String(label || "").replace(/[（(].*?[)）]/g, "").trim();
  for(var i=0;i<secs.length;i++){
    var st0 = String(secs[i].title || "");
    if(st0 && t.length>=2 && (st0.indexOf(t) >= 0 || t.indexOf(st0) >= 0)) return secs[i];
  }
  var grams = bigrams(label), uniq = {}, keys = [];
  grams.forEach(function(g){ if(!uniq[g]){ uniq[g]=1; keys.push(g); } });
  if(!keys.length || !secs.length) return fallback || null;

  var rows = [];
  for(var j=0;j<secs.length;j++){
    var st = String(secs[j].title||""), bd = String(secs[j].body||"");
    var titleHit = 0, bodyHit = 0;
    keys.forEach(function(g){
      if(st.indexOf(g) >= 0) titleHit++;
      else if(bd.indexOf(g) >= 0) bodyHit++;
    });
    rows.push({sec:secs[j], score: titleHit*3 + bodyHit});
  }
  var best = 0;
  rows.forEach(function(r){ if(r.score > best) best = r.score; });
  if(best <= 0) return fallback || null;

  var cands = rows.filter(function(r){ return r.score === best; }).map(function(r){ return r.sec; });
  if(fallback && cands.indexOf(fallback) >= 0) return fallback;   // 同分优先父级小节
  if(fallback && fallback.num){                                   // 否则优先编号前缀最接近的
    var fp = String(fallback.num), pick = cands[0], pickLen = -1;
    cands.forEach(function(s){
      var sn = String(s.num||""), len = 0;
      while(len < sn.length && len < fp.length && sn.charAt(len) === fp.charAt(len)) len++;
      if(len > pickLen){ pickLen = len; pick = s; }
    });
    return pick;
  }
  return cands[0];
}

var root = N({id:"root", type:"root", label:D.title||"系统集成项目管理工程师", sub:"第3版教材 · 全18章"});
var chapters = [];
var modules = (D.modules||[]).map(function(m){
  var mn = N({id:m.id, type:"module", label:m.title, range:m.range, logic:m.logic, weight:m.weight,
               module:m.id, chRefs:m.chapters});
  E("root", m.id);
  m.chapters.forEach(function(c){
    var cn = N({id:c.id, type:"chapter", label:c.title, num:c.num, module:m.id, data:c, mapItems:[]});
    chapters.push(cn);
    E(m.id, c.id);
    (c.map||[]).forEach(function(mi, miIdx){
      var mapId = c.id+"-m"+miIdx;
      var sec = sectionForMapItem(c, mi);
      var mnode = N({id:mapId, type:"mapitem", label:mi.t, module:m.id, chapter:c.id, subIds:[], sec:sec});
      cn.mapItems.push(mnode);
      E(c.id, mapId);
      (mi.c||[]).forEach(function(sc, sci){
        var sid = mapId+"-s"+sci;
        N({id:sid, type:"sub", label:sc, module:m.id, chapter:c.id, map:mapId,
           sec: sectionForSub(c, sc, sec)});
        mnode.subIds.push(sid);
        E(mapId, sid);
      });
    });
  });
  return mn;
});

/* ================= sizes ================= */
var SIZE = { root:{w:250,h:58}, module:{w:180,h:52}, chapter:{w:150,h:46}, mapitem:{w:160,h:36}, sub:{w:126,h:28} };
function subW(label){ return Math.min(Math.max(label.length*12 + 22, 92), 250); }
function nodeW(n){ return n.type==="sub" ? subW(n.label) : (SIZE[n.type]||SIZE.sub).w; }

/* ================= view state ================= */
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var state = {
  mode:"overview", focusId:null, scale:1, offX:0, offY:0, highlight:null,
  openMods:{m1:true,m2:true,m3:true}
};
var modeStar = false;

function isNarrow(){ return cv.clientWidth < 760; }
function panelOpen(){ return document.getElementById("panel").classList.contains("open"); }

/* ================= layouts ================= */
function layoutOverview(){
  root.x=0; root.y=0;
  if(isNarrow()){
    var y = 150;
    modules.forEach(function(mn){
      mn.x = 0; mn.y = y;
      if(state.openMods[mn.id]){
        var chs = mn.chRefs, rows = Math.ceil(chs.length/2);
        chs.forEach(function(c, j){
          var cn = byId[c.id];
          cn.x = (j % 2 === 0) ? -84 : 84;
          cn.y = y + 100 + Math.floor(j/2)*80;
        });
        y = y + 100 + rows*80;
      } else {
        y = y + 118;
      }
    });
  } else {
    var xs = [-380, 0, 380];
    modules.forEach(function(mn, i){
      mn.x = xs[i]; mn.y = 130;
      if(state.openMods[mn.id]){
        var chs = mn.chRefs;
        chs.forEach(function(c, j){
          var cn = byId[c.id];
          cn.x = xs[i] + (j % 2 === 0 ? -88 : 88);
          cn.y = 252 + Math.floor(j/2)*84;
        });
      }
    });
  }
}

function layoutStarOverview(){
  root.x=0; root.y=0;
  var total = 0;
  modules.forEach(function(mn){ if(state.openMods[mn.id]) total += mn.chRefs.length; });
  if(!total) total = 1;
  var ang = -90;
  modules.forEach(function(mn){
    var chs = mn.chRefs;
    var n = state.openMods[mn.id] ? chs.length : 0;
    var share = (n ? n/total : 0)*360;
    if(!n){ // 收起时给模块一个固定小扇区，保证模块本身可见
      var a0 = (ang + 30)*Math.PI/180;
      mn.x = Math.cos(a0)*230; mn.y = Math.sin(a0)*230;
      ang += 60;
      return;
    }
    var mid = ang + share/2, a = mid*Math.PI/180;
    mn.x = Math.cos(a)*230; mn.y = Math.sin(a)*230;
    var step = share/n;
    chs.forEach(function(c, j){
      var cn = byId[c.id];
      var aa = (ang + step*j + step/2)*Math.PI/180;
      cn.x = Math.cos(aa)*520; cn.y = Math.sin(aa)*520;
    });
    ang += share;
  });
}

function layoutFocus(chId){
  var ch = byId[chId];
  var narrow = isNarrow();
  var ROW = 34, GAP = narrow ? 26 : 22;
  function subsOf(mi){ return mi.subIds.map(function(id){ return byId[id]; }); }

  // 依次累计每个「知识点」的考点块高度，保证相邻块不会互相压字
  var acc = 0;
  ch.mapItems.forEach(function(mi){
    var n = Math.max(1, subsOf(mi).length);
    mi._top = acc; mi._n = n;
    acc += n*ROW + GAP;
  });
  var totalH = Math.max(ROW, acc - GAP);
  var top0 = -totalH/2;

  if(narrow){
    // 手机端：章节在上，知识点在左，考点竖排在右（从上往下读）
    ch.x = 0; ch.y = top0 - 94;
    ch.mapItems.forEach(function(mi){
      var subs = subsOf(mi), bTop = top0 + mi._top;
      mi.x = -92; mi.y = bTop + mi._n*ROW/2;
      subs.forEach(function(s, j){ s.x = 112; s.y = bTop + j*ROW + ROW/2; });
    });
  } else {
    // 桌面端：章节 → 知识点 → 考点 三列
    ch.x = 0; ch.y = 0;
    ch.mapItems.forEach(function(mi){
      var subs = subsOf(mi), bTop = top0 + mi._top;
      mi.x = 320; mi.y = bTop + mi._n*ROW/2;
      subs.forEach(function(s, j){ s.x = 645; s.y = bTop + j*ROW + ROW/2; });
    });
  }
}

/* ================= visibility ================= */
function visibleNodes(){
  if(state.mode==="overview"){
    var arr = [root].concat(modules);
    modules.forEach(function(mn){
      if(state.openMods[mn.id]) arr = arr.concat(mn.chRefs.map(function(c){ return byId[c.id]; }));
    });
    return arr;
  }
  var ch = byId[state.focusId];
  if(!ch) return [];
  var subs = [];
  ch.mapItems.forEach(function(mi){ mi.subIds.forEach(function(id){ subs.push(byId[id]); }); });
  return [ch].concat(ch.mapItems).concat(subs);
}
function visibleEdges(){
  var vis = {};
  visibleNodes().forEach(function(n){ vis[n.id] = true; });
  if(state.mode==="overview"){
    // 端点都可见才画线：收起某个部分时，它的章节连线一起消失
    return edges.filter(function(e){ return vis[e.a] && vis[e.b]; });
  }
  var f = state.focusId;
  return edges.filter(function(e){
    var a = byId[e.a], b = byId[e.b];
    if(!a || !b || !vis[e.a] || !vis[e.b]) return false;
    return a.id===f || a.chapter===f;
  });
}

/* ================= transforms ================= */
function w2s(w){ return {x:w.x*state.scale+state.offX, y:w.y*state.scale+state.offY}; }
function s2w(s){ return {x:(s.x-state.offX)/state.scale, y:(s.y-state.offY)/state.scale}; }

function boundsOf(list){
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  list.forEach(function(n){
    var s = SIZE[n.type]||SIZE.sub;
    var hw = nodeW(n)/2, hh = s.h/2;
    if(n.x-hw<minX)minX=n.x-hw; if(n.x+hw>maxX)maxX=n.x+hw;
    if(n.y-hh<minY)minY=n.y-hh; if(n.y+hh>maxY)maxY=n.y+hh;
  });
  return {w:maxX-minX, h:maxY-minY, cx:(minX+maxX)/2, cy:(minY+maxY)/2, minX:minX, minY:minY, maxX:maxX, maxY:maxY};
}

function uiInsets(){
  var W=cv.clientWidth, H=cv.clientHeight;
  var ins = {l:30, r:30, t:112, b:80};
  if(panelOpen()){
    if(W<701){ ins.b = Math.round(H*0.58); }
    else { ins.r = 424; }
  }
  return ins;
}

function fitView(){
  var list = visibleNodes();
  if(!list.length) return;
  var b = boundsOf(list);
  var W = cv.clientWidth, H = cv.clientHeight;
  if(W<2 || H<2) return;
  var ins = uiInsets();
  var availW = Math.max(90, W - ins.l - ins.r);
  var availH = Math.max(90, H - ins.t - ins.b);
  var sc = Math.min(availW/b.w, availH/b.h);
  // 保证文字可读，宁可让用户平移
  var minSc = (state.mode==="focus") ? 0.8 : (modeStar ? 0.34 : 0.56);
  sc = Math.max(minSc, Math.min(sc, 1.7));
  state.scale = sc;
  // 水平：放得下就居中，放不下从左边开始
  if(b.w*sc <= availW) state.offX = ins.l + availW/2 - b.cx*sc;
  else state.offX = ins.l - b.minX*sc;
  // 竖直：放得下就居中，放不下从顶部开始（符合从上往下读）
  if(b.h*sc <= availH) state.offY = ins.t + availH/2 - b.cy*sc;
  else state.offY = ins.t - b.minY*sc;
  render();
}

function relayout(){
  if(state.mode==="focus") layoutFocus(state.focusId);
  else if(modeStar) layoutStarOverview();
  else layoutOverview();
}

/* ================= mode switching ================= */
function syncDetailBtn(){
  var b = document.getElementById("detailBtn");
  b.classList.toggle("show", state.mode === "focus" && !panelOpen());
}
function setMode(mode, id){
  if(mode==="focus" && id){
    layoutFocus(id);
    state.mode = "focus"; state.focusId = id; state.highlight = null;
    document.getElementById("backBtn").style.display = "flex";
    renderNodePanel(id, !isNarrow());      // 手机端不自动弹出，避免遮挡
    syncDetailBtn();
    fitView();
  } else {
    state.mode = "overview"; state.focusId = null; state.highlight = null;
    relayout();
    document.getElementById("backBtn").style.display = "none";
    closePanel();
    syncDetailBtn();
    fitView();
  }
}

/* ================= drawing ================= */
function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function fs(base){ return Math.max(6.5, Math.min(base*state.scale, 21)); }
function trunc(c, text, maxW, font){
  c.font = font;
  if(c.measureText(text).width <= maxW) return text;
  var t = text;
  while(t.length > 1 && c.measureText(t+"…").width > maxW) t = t.slice(0,-1);
  return t+"…";
}
function font(sz, bold){ return (bold?"700 ":"")+sz+"px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"; }

function drawEdge(a, b, color, w){
  var A = w2s(a), B = w2s(b);
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, w*state.scale);
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawNode(n){
  var s = SIZE[n.type]||SIZE.sub;
  var w = nodeW(n)*state.scale, h = s.h*state.scale;
  var p = w2s(n), x = p.x, y = p.y;
  var mod = MOD[n.module];
  var focused = (n.id === state.focusId);
  var hl = (n.id === state.highlight);

  if(hl){
    // 高亮贴着节点本身的圆角矩形，而不是一个大圆
    roundRect(ctx, x-w/2-6, y-h/2-6, w+12, h+12, 11*state.scale);
    ctx.fillStyle = "rgba(245,158,11,.22)"; ctx.fill();
  }
  if(focused){
    roundRect(ctx, x-w/2-5, y-h/2-5, w+10, h+10, 11*state.scale);
    ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 3; ctx.stroke();
  }

  if(n.type==="root"){
    roundRect(ctx, x-w/2, y-h/2, w, h, 14*state.scale);
    ctx.fillStyle = ROOTC.main; ctx.fill();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    var f1 = fs(15); ctx.font = font(f1, true);
    ctx.fillText(trunc(ctx, n.label, w-24, font(f1,true)), x, y-9);
    var f2 = fs(10); ctx.font = font(f2, false); ctx.fillStyle = "rgba(255,255,255,.72)";
    ctx.fillText(trunc(ctx, n.sub, w-24, font(f2,false)), x, y+15);
  } else if(n.type==="module"){
    roundRect(ctx, x-w/2, y-h/2, w, h, 12*state.scale);
    ctx.fillStyle = mod.main; ctx.fill();
    var parts = n.label.split("·");
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
    var fa = fs(11); ctx.font = font(fa, false);
    ctx.fillText(trunc(ctx, (parts[0]||"").trim(), w-20, font(fa,false)), x, y-9);
    var fb = fs(13); ctx.font = font(fb, true);
    ctx.fillText(trunc(ctx, (parts[1]||"").trim(), w-20, font(fb,true)), x, y+11);
  } else if(n.type==="chapter"){
    roundRect(ctx, x-w/2, y-h/2, w, h, 10*state.scale);
    ctx.fillStyle = mod.soft; ctx.fill();
    ctx.strokeStyle = focused ? "#f59e0b" : mod.line;
    ctx.lineWidth = focused ? 2.5 : 1.5; ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = mod.deep;
    var ca = fs(9.5); ctx.font = font(ca, true);
    ctx.fillText("第"+n.num+"章", x, y-8);
    ctx.fillStyle = INK;
    var cb = fs(12); ctx.font = font(cb, true);
    ctx.fillText(trunc(ctx, n.label, w-14, font(cb,true)), x, y+10);
  } else if(n.type==="mapitem"){
    roundRect(ctx, x-w/2, y-h/2, w, h, 9*state.scale);
    ctx.fillStyle = mod.soft; ctx.fill();
    ctx.strokeStyle = mod.line; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = mod.deep; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var mf = fs(11.5); ctx.font = font(mf, true);
    ctx.fillText(trunc(ctx, n.label, w-14, font(mf,true)), x, y);
  } else {
    roundRect(ctx, x-w/2, y-h/2, w, h, 8*state.scale);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.strokeStyle = mod.line; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var sf = fs(10); ctx.font = font(sf, false);
    ctx.fillText(trunc(ctx, n.label, w-12, font(sf,false)), x, y);
  }
}

function render(){
  var dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth, H = cv.clientHeight;
  if(W < 2 || H < 2) return;
  if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  // 点阵背景
  ctx.fillStyle = "rgba(22,50,79,.05)";
  var g = 36*state.scale; if(g < 16) g = 16;
  var sx = ((state.offX % g) + g) % g, sy = ((state.offY % g) + g) % g;
  for(var gx=sx; gx<W; gx+=g) for(var gy=sy; gy<H; gy+=g) ctx.fillRect(gx,gy,1.2,1.2);

  visibleEdges().forEach(function(e){
    var a = byId[e.a], b = byId[e.b];
    if(!a || !b) return;
    var color = (a.type==="root") ? ROOTC.main : ((MOD[a.module]||MOD.m1).line);
    drawEdge(a, b, color, 1.4);
  });

  visibleNodes().forEach(drawNode);
}

/* ================= detail panel ================= */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(src){
  if(!src) return "";
  var lines = src.split("\n");
  var html = "", inUl=false, inOl=false, inTable=false, tableRows=[], inBq=false;
  function inline(t){
    return esc(t).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
                 .replace(/\*([^*]+)\*/g,"<em>$1</em>")
                 .replace(/`([^`]+)`/g,"<code>$1</code>");
  }
  function closeLists(){ if(inUl){html+="</ul>";inUl=false;} if(inOl){html+="</ol>";inOl=false;} }
  function closeBq(){ if(inBq){html+="</blockquote>";inBq=false;} }
  function flushTable(){
    if(!inTable) return;
    inTable = false;
    if(!tableRows.length){ tableRows=[]; return; }
    var head = tableRows[0], body = tableRows.slice(1);
    var th = head.map(function(c){ return "<th>"+inline(c)+"</th>"; }).join("");
    var rows = body.map(function(r){
      return "<tr>"+r.map(function(c){ return "<td>"+inline(c)+"</td>"; }).join("")+"</tr>";
    }).join("");
    html += "<table><thead><tr>"+th+"</tr></thead><tbody>"+rows+"</tbody></table>";
    tableRows = [];
  }
  for(var i=0;i<lines.length;i++){
    var t = lines[i].trim();
    // 表格
    if(/^\|.*\|$/.test(t)){
      closeLists(); closeBq();
      if(!inTable){ inTable = true; tableRows = []; }
      var cells = t.replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){ return c.trim(); });
      if(!/^[\s:\-|]+$/.test(t.replace(/\|/g,""))) tableRows.push(cells);
      continue;
    } else { flushTable(); }
    if(/^#### /.test(t)){ closeLists(); closeBq(); html+="<h4>"+inline(t.slice(5))+"</h4>"; continue; }
    if(/^### /.test(t)){ closeLists(); closeBq(); html+="<h3>"+inline(t.slice(4))+"</h3>"; continue; }
    if(/^## /.test(t)){ closeLists(); closeBq(); html+="<h2>"+inline(t.slice(3))+"</h2>"; continue; }
    if(/^# /.test(t)){ closeLists(); closeBq(); html+="<h1>"+inline(t.slice(2))+"</h1>"; continue; }
    if(/^---+$/.test(t)){ closeLists(); closeBq(); html+="<hr>"; continue; }
    if(/^>/.test(t)){ closeLists(); if(!inBq){ html+="<blockquote>"; inBq=true; } html += inline(t.replace(/^>\s?/,""))+"<br>"; continue; }
    if(/^[-*] /.test(t)){ closeBq(); if(!inUl){ closeLists(); html+="<ul>"; inUl=true; } html+="<li>"+inline(t.slice(2))+"</li>"; continue; }
    if(/^\d+\. /.test(t)){ closeBq(); if(!inOl){ closeLists(); html+="<ol>"; inOl=true; } html+="<li>"+inline(t.replace(/^\d+\.\s/,""))+"</li>"; continue; }
    if(t===""){ closeLists(); closeBq(); continue; }
    closeLists(); closeBq(); html+="<p>"+inline(t)+"</p>";
  }
  flushTable(); closeLists(); closeBq();
  return html;
}

function tryMark(html, needle){
  if(!needle || needle.length < 2) return null;
  var safe = String(needle).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var probe = new RegExp("(?![^<]*>)("+safe+")", "g");
  if(!probe.test(html)) return null;
  return html.replace(new RegExp("(?![^<]*>)("+safe+")", "g"), '<mark class="hit">$1</mark>');
}
function markHit(html, label){
  if(!label) return html;
  var cands = [String(label).trim()];
  // 拆出中文块："10个子管理计划" -> "个子管理计划"
  var chunks = String(label).replace(/[^\u4e00-\u9fa5]+/g, " ").split(/\s+/).filter(function(w){ return w.length >= 2; });
  chunks.forEach(function(w){ cands.push(w); });
  // 再逐步去掉开头字，适配正文写法差异（"个子管理计划" -> "子管理计划"）
  chunks.forEach(function(w){
    for(var i = 1; i <= w.length - 3; i++) cands.push(w.slice(i));
  });
  for(var i=0;i<cands.length;i++){
    var hit = tryMark(html, cands[i]);
    if(hit) return hit;
  }
  return html;
}
function paintPanel(head, body){
  document.getElementById("panel").innerHTML =
    '<div class="phead"><button class="pclose" id="pclose">✕</button>'+head+'</div><div class="pbody">'+body+'</div>';
}
function openPanelState(open){
  var p = document.getElementById("panel");
  p.classList.toggle("open", !!open);
  document.body.classList.toggle("panelopen", p.classList.contains("open"));
  var btn = document.getElementById("pclose");
  if(btn) btn.onclick = function(){ closePanel(); syncDetailBtn(); fitView(); };
  syncDetailBtn();
}

function wireChips(){
  var p = document.getElementById("panel");
  p.querySelectorAll("[data-sub]").forEach(function(el){
    el.onclick = function(){
      var id = el.getAttribute("data-sub");
      state.highlight = id;
      renderNodePanel(id, true);
      render();
    };
  });
}

/* 第三级：章节 */
function renderChapterPanel(chId, open){
  var n = byId[chId], c = n.data, mod = MOD[n.module];
  var choiceN = (c.quizOriginal && c.quizOriginal.choice) ? c.quizOriginal.choice.length : 0;
  var essayN  = (c.quizOriginal && c.quizOriginal.essay)  ? c.quizOriginal.essay.length  : 0;
  var selfN   = c.quizSelf ? c.quizSelf.length : 0;

  var head = '<div class="pt">第'+n.num+'章 · '+esc(c.title)+'</div>'
    + '<div class="psub">'+esc(mod ? ("第"+({m1:"一",m2:"二",m3:"三"}[n.module]||"")+"部分 · "+mod.name) : "")+'</div>';

  var body = '<div class="sec"><div class="h">🧠 作者的写作思路（= 出题逻辑）</div><div class="logic">'+md(c.authorLogic)+'</div></div>';
  if(c.map && c.map.length){
    body += '<div class="sec"><div class="h">🗺️ 逻辑架构（点图中知识点看小节正文）</div>';
    c.map.forEach(function(mi){
      body += '<div class="mapline"><div class="mt">'+esc(mi.t)+'</div><div class="mc">'+(mi.c||[]).map(esc).join("、")+'</div></div>';
    });

  }
  if(c.sections && c.sections.length){
    body += '<div class="sec"><div class="h">📖 各节（'+c.sections.length+' 节）</div>';
    c.sections.forEach(function(s){
      body += '<div class="srow"><span class="sn">'+esc(s.num)+'</span><span class="st">'+esc(s.title)+'</span></div>';
    });
    body += '</div>';
  }
  body += '<div class="sec"><div class="h">📝 训练题</div>'
    + '<span class="chip">📗 教材原题·选择 '+choiceN+'</span>'
    + '<span class="chip">📝 思考题 '+essayN+'</span>'
    + '<span class="chip">✍️ 自编题 '+selfN+'</span></div>';
  body += '<div class="btnline"><a class="openbtn" href="index.html#/ch/'+esc(c.id)+'">打开本章完整学习页 →</a></div>';

  paintPanel(head, body);
  openPanelState(open);

/* 第四级知识点 / 第五级考点：直接展示所属小节正文 */
function renderSectionPanel(nodeId, open){
  var n = byId[nodeId];
  if(!n) return;
  var ch = byId[n.chapter], c = ch.data, mod = MOD[n.module];
  var sec = n.sec, isSub = (n.type === "sub");

  if(!sec){
    // 「总览/总体/概述」这类汇总节点：直接回落到整章概览
    if(/总览|总体|概述/.test(n.label)){
      renderChapterPanel(n.chapter, open);
      return;
    }
    var src = isSub ? byId[n.map] : n;
    var head0 = '<div class="pt">'+esc(n.label)+'</div>'
      + '<div class="psub">第'+ch.num+'章 · '+esc(c.title)+'</div>';
    var body0 = '<div class="sec"><div class="h">🔗 该知识点的考点（点击查看对应正文）</div>';
    (src && src.subIds ? src.subIds : []).forEach(function(id){
      body0 += '<span class="chip" data-sub="'+id+'">'+esc(byId[id].label)+'</span>';
    });
    body0 += '</div>';
    paintPanel(head0, body0);
    openPanelState(open);
    wireChips();
    return;
  }

  var head = '<div class="pt">'+esc(sec.num)+' '+esc(sec.title)+'</div>'
    + '<div class="psub">第'+ch.num+'章 · '+esc(c.title)+(isSub ? '　|　考点：'+esc(n.label) : '')+'</div>';

  var body = '';
  if(sec.position){
    body += '<div class="postag"><b>📍 定位</b>：'+md(sec.position)+'</div>';
  }
  var logic = md(sec.body);
  if(isSub) logic = markHit(logic, n.label);
  body += '<div class="logic">'+logic+'</div>';

  var group = isSub ? byId[n.map] : n;
  if(group && group.subIds && group.subIds.length){
    body += '<div class="sec" style="margin-top:16px"><div class="h">🔗 本节考点（点击切换）</div>';
    group.subIds.forEach(function(id){
      var s = byId[id];
      body += '<span class="chip'+(s.id===state.highlight?' on':'')+'" data-sub="'+id+'">'+esc(s.label)+'</span>';
    });
    body += '</div>';
  }

  paintPanel(head, body);
  openPanelState(open);
  wireChips();
}

function renderNodePanel(nodeId, open){
  var n = byId[nodeId];
  if(!n) return;
  if(n.type === "chapter") renderChapterPanel(nodeId, open);
  else renderSectionPanel(nodeId, open);
}

/* 手机端：面板打开后，把刚点的节点滚进可见区域，避免被面板挡住 */
function ensureVisible(id){
  var n = byId[id];
  if(!n) return;
  var W = cv.clientWidth, H = cv.clientHeight;
  if(W >= 701) return;
  var bottom = panelOpen() ? H - Math.round(H*0.58) : H - 90;
  var top = 112;
  var p = w2s(n);
  if(p.y > bottom - 30 || p.y < top + 16){
    var target = (top + bottom) / 2;
    state.offY += (target - p.y);
    render();
  }
}

function closePanel(){
  document.getElementById("panel").classList.remove("open");
  document.body.classList.remove("panelopen");
}

/* ================= pointer interaction ================= */
var pointers = new Map();
var drag = null, pinch = null;

function midOf(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function distOf(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

cv.addEventListener("pointerdown", function(e){
  try { cv.setPointerCapture(e.pointerId); } catch(_) {}
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){
    drag = {sx:e.clientX, sy:e.clientY, offX:state.offX, offY:state.offY, moved:false};
    pinch = null;
  } else if(pointers.size === 2){
    var pts = Array.from(pointers.values());
    var m = midOf(pts[0], pts[1]);
    pinch = {dist: distOf(pts[0],pts[1]) || 1, scale: state.scale, midWorld: s2w(m)};
    drag = null;
  }
});
cv.addEventListener("pointermove", function(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1 && drag){
    var dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if(Math.hypot(dx,dy) > 5) drag.moved = true;
    state.offX = drag.offX + dx;
    state.offY = drag.offY + dy;
    render();
  } else if(pointers.size === 2 && pinch){
    var pts = Array.from(pointers.values());
    var m = midOf(pts[0], pts[1]);
    var d = distOf(pts[0], pts[1]) || 1;
    var sc = Math.max(0.22, Math.min(pinch.scale * d/pinch.dist, 4));
    state.scale = sc;
    state.offX = m.x - pinch.midWorld.x*sc;
    state.offY = m.y - pinch.midWorld.y*sc;
    render();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size === 0){
    if(drag && !drag.moved){
      var hit = hitTest(e.clientX, e.clientY);
      if(hit) onTap(hit);
    }
    drag = null; pinch = null;
  } else if(pointers.size === 1){
    var pts = Array.from(pointers.values());
    drag = {sx:pts[0].x, sy:pts[0].y, offX:state.offX, offY:state.offY, moved:false};
    pinch = null;
  }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

cv.addEventListener("wheel", function(e){
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  zoomAt(Math.pow(1.0015, -e.deltaY), e.clientX-r.left, e.clientY-r.top);
}, {passive:false});

function zoomAt(factor, mx, my){
  var w = s2w({x:mx, y:my});
  var sc = Math.max(0.22, Math.min(state.scale*factor, 4));
  state.scale = sc;
  state.offX = mx - w.x*sc;
  state.offY = my - w.y*sc;
  render();
}

function hitTest(sx, sy){
  var list = visibleNodes();
  for(var i=list.length-1; i>=0; i--){
    var n = list[i];
    var s = SIZE[n.type]||SIZE.sub;
    var p = w2s(n);
    var hw = nodeW(n)*state.scale/2, hh = s.h*state.scale/2;
    var tol = 10;
    if(Math.abs(sx-p.x) <= hw+tol && Math.abs(sy-p.y) <= hh+tol) return n;
  }
  return null;
}

function onTap(n){
  if(state.mode === "overview"){
    if(n.type === "module"){
      state.openMods[n.id] = !state.openMods[n.id];
      relayout(); fitView();
    } else if(n.type === "chapter"){
      setMode("focus", n.id);
    }
  } else {
    if(n.type === "chapter"){ setMode("overview"); }
    else if(n.type === "mapitem" || n.type === "sub"){
      state.highlight = n.id;
      renderNodePanel(n.id, true);   // 右侧直接显示该小节正文
      fitView();
      ensureVisible(n.id);
      render();
    }
  }
}

/* ================= controls ================= */
document.getElementById("zoomIn").onclick = function(){

document.getElementById("zoomOut").onclick = function(){

document.getElementById("detailBtn").onclick = function(){

  if(panelOpen()){ closePanel(); syncDetailBtn(); fitView(); }
  else { renderNodePanel(state.highlight || state.focusId, true); fitView(); }
};

document.getElementById("modeBtn").onclick = function(){
  modeStar = !modeStar;
  this.textContent = modeStar ? "🌳" : "🕸️";
  this.title = modeStar ? "切换为树状" : "切换为星图";
  relayout(); fitView();
};

/* ================= search ================= */
function plain(s){
  return String(s||"").replace(/[#*`|>\-]+/g," ").replace(/\s+/g," ").toLowerCase();
}
var idx = [];
chapters.forEach(function(cn){
  idx.push({node:cn, display:"第"+cn.num+"章 "+cn.label, search:plain("第"+cn.num+"章 "+cn.label), tag:"章节"});
  ((cn.data && cn.data.sections) || []).forEach(function(s){
    idx.push({
      node:cn,
      display:"第"+cn.num+"章 · "+s.num+" "+s.title,
      search:plain(s.num+" "+s.title+" "+(s.position||"")+" "+(s.body||"")),
      tag:"节"
    });
  });
});
nodes.forEach(function(n){
  if(n.type === "mapitem") idx.push({node:n, display:n.label, search:plain(n.label), tag:"知识点"});
  else if(n.type === "sub") idx.push({node:n, display:n.label, search:plain(n.label), tag:"考点"});
});

var searchEl = document.getElementById("search"),
    searchInput = document.getElementById("searchInput"),
    searchRes = document.getElementById("searchRes");

document.getElementById("searchBtn").onclick = function(){
  searchEl.classList.toggle("open");
  if(searchEl.classList.contains("open")){
    searchInput.value = ""; searchRes.style.display = "none";
    setTimeout(function(){ searchInput.focus(); }, 60);
  }
};
document.getElementById("searchClose").onclick = function(){ searchEl.classList.remove("open"); };

searchInput.oninput = function(){
  var kw = plain(this.value).trim();
  if(!kw){ searchRes.style.display = "none"; return; }
  var hits = idx.filter(function(it){ return it.search.indexOf(kw) >= 0; }).slice(0, 20);
  searchRes.style.display = "block";
  if(!hits.length){ searchRes.innerHTML = '<div class="empty">未找到相关内容</div>'; return; }
  searchRes.innerHTML = hits.map(function(h, i){
    return '<div class="r" data-i="'+i+'">'+esc(h.display)+'<span class="tag">'+esc(h.tag)+'</span></div>';
  }).join("");
  searchRes.querySelectorAll(".r").forEach(function(elm){
    elm.onclick = function(){
      var h = hits[+elm.getAttribute("data-i")];
      var chId = h.node.chapter || h.node.id;
      state.openMods[h.node.module] = true;
      setMode("focus", chId);
      state.highlight = h.node.id;
      if(h.node.type === "mapitem" || h.node.type === "sub") renderNodePanel(h.node.id, true);
      fitView();
      render();
      searchEl.classList.remove("open");
    };
  });
};

    return '<div class="lg"><span class="dot" style="background:'+m.main+'"></span>'+m.name+'</div>';
