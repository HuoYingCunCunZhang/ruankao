<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>思维导图 · 系统集成项目管理工程师</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#1a2233; --ink2:#5a6478; --ink3:#8a93a6;
  --line:#e2e8f2; --brand:#1f6feb; --brand-soft:#e8f0fe; --amber:#b45309; --amber-soft:#fef3c7;
  --green:#065f46; --green-soft:#d1fae5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
#app{max-width:860px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:linear-gradient(135deg,#16324f,#1f4e7a);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar a{flex:none;color:#fff;text-decoration:none;font-size:14px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:8px}
.topbar .title{flex:1;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar button{flex:none;height:32px;padding:0 10px;border-radius:8px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.content{padding:12px}
.note{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.tree{margin-top:4px}
.nd{}
.lbl{display:flex;align-items:flex-start;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .12s}
.lbl:hover{background:rgba(31,111,235,.07)}
.lbl.branch>.txt{font-weight:650}
.lbl.leaf>.txt{color:var(--amber);font-weight:500}
.lbl.root>.txt{font-size:17px;font-weight:800;color:var(--brand)}
.tg{flex:none;width:16px;text-align:center;color:var(--ink3);font-size:11px;margin-top:3px}
.tg.leafdot{color:var(--amber)}
.txt{flex:1;min-width:0;word-break:break-word}
.kids{margin-left:11px;padding-left:15px;border-left:1.5px solid var(--line)}
.kids>.nd>.lbl{position:relative}
.kids>.nd>.lbl::before{content:'';position:absolute;left:-15px;top:16px;width:11px;border-top:1.5px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.dot.a{background:#f59e0b}.dot.g{background:#10b981}.dot.b{background:#1f6feb}
/* 叶子展开的重点内容卡片 */
.dt{margin:2px 0 10px 22px;padding:10px 12px;background:#fff;border-left:3px solid #f59e0b;border-radius:8px;font-size:13px;line-height:1.75;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.dt-h{font-weight:700;color:#b45309;margin-bottom:6px}
.dt-mem{margin-top:8px;padding:8px 10px;background:#fef3c7;border-radius:8px;color:#92400e;font-size:12.5px}
.dt .md-h{font-weight:700;margin:8px 0 4px;color:var(--ink)}
.dt .md-p{margin:2px 0}
.dt table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.dt th,.dt td{border:1px solid #e5eaf3;padding:4px 6px;text-align:left}
.dt th{background:#f7f9fc}
.dt ul{margin:4px 0;padding-left:18px}
.lbl.leaf.has-detail>.txt{color:#b45309}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a href="index.html">‹ 返回</a>
    <span class="title">思维导图 · 知识串联版</span>
    <button onclick="expandAll()">展开</button>
    <button onclick="collapseAll()">收起</button>
  </div>
  <div class="content">
    <div class="note">📌 层级：全书 → 3 大部分 → 18 章 → 逻辑架构节点 → <b>考点</b>。点 ▾ 展开；<b>琥珀色叶子 = 考点/记忆点</b>，绿色 = 记忆技巧。</div>
    <div class="legend">
      <span><i class="dot b"></i>章节/主题</span>
      <span><i class="dot a"></i>考点（叶子）</span>
      <span><i class="dot g"></i>记忆技巧</span>
    </div>
    <div class="tree" id="tree"></div>
  </div>
</div>
<script src="content.js"></script>
<script>
(function(){
  "use strict";
  var D = window.COURSE_DATA;
  if(!D){ document.getElementById('tree').innerHTML = '<div class="note">内容加载失败</div>'; return; }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 轻量 markdown 渲染（用于叶子展开的重点内容）
  function md(src){
    if(!src) return '';
    var lines = String(src).split('\n');
    var out = '', inUl = false, inTable = false, rows = [];
    function closeUl(){ if(inUl){ out += '</ul>'; inUl = false; } }
    function inline(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
    function flushTable(){
      if(!inTable) return; inTable = false;
      if(!rows.length) return;
      var head = rows[0], body = rows.slice(1);
      out += '<table><thead><tr>' + head.map(function(c){ return '<th>'+inline(c)+'</th>'; }).join('') + '</tr></thead><tbody>'
        + body.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>'+inline(c)+'</td>'; }).join('') + '</tr>'; }).join('')
        + '</tbody></table>';
      rows = [];
    }
    lines.forEach(function(line){
      var t = line.trim();
      if(/^\|.*\|$/.test(t)){
        if(!inTable){ inTable = true; rows = []; }
        var cells = t.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){ return c.trim(); });
        if(!/^[\s:\-|]+$/.test(t.replace(/\|/g,''))) rows.push(cells);
        return;
      } else { flushTable(); }
      if(/^#{1,4}\s/.test(t)){ closeUl(); out += '<div class="md-h">'+inline(t.replace(/^#+\s*/,''))+'</div>'; return; }
      if(/^[-*]\s/.test(t)){ if(!inUl){ out += '<ul>'; inUl = true; } out += '<li>'+inline(t.slice(2))+'</li>'; return; }
      if(t === ''){ closeUl(); return; }
      closeUl(); out += '<div class="md-p">'+inline(t)+'</div>';
    });
    flushTable(); closeUl();
    return out;
  }

  function renderDetail(sec, ch){
    var h = '<div class="dt-h">📍 第' + ch.num + '章 ' + esc(ch.title) + ' · ' + esc(sec.num) + ' ' + esc(sec.title) + '</div>';
    h += md(sec.body);
    if(sec.memorize){ h += '<div class="dt-mem">🧠 记忆技巧：<br>' + md(sec.memorize) + '</div>'; }
    return h;
  }

  // 跨章主线：把知识串起来
  var CHAINS = [
    { t: '① 三基准主线', c: ['需求 → 范围基准 → 进度基准 → 成本基准（范围、进度、成本依次递进，构成项目管理计划三大基准）'] },
    { t: '② 变更主线', c: ['需求/任何变更 → 提出变更请求（书面）→ 整体影响分析 → CCB 审批 → 实施 → 记录 → 分发；变更须纳入配置管理'] },
    { t: '③ 质量主线', c: ['规划质量（定标准）→ 管理质量（保过程）→ 控制质量（验成果）→ 确认范围（客户验收）'] },
    { t: '④ 风险主线', c: ['规划风险 → 识别风险 → 定性分析（概率×影响排序）→ 定量分析（EMV/蒙特卡洛）→ 应对（威胁/机会策略）→ 监督风险'] },
    { t: '⑤ 收尾主线', c: ['验收（测/试运行/文档/终验）→ 移交（用户/运维/组织）→ 总结（经验教训入库）'] },
    { t: '⑥ 依据主线', c: ['法律 → 标准 → 合同 → 项目计划：越往下越具体，共同构成"做项目的规矩"'] }
  ];

  // 高频辨析：成对出现的易混点，对比记忆
  var DISPUTES = [
    { t: '确认范围 vs 控制质量', c: ['确认范围：关注可交付成果的「验收」（客户/发起人签字）', '控制质量：关注可交付成果的「正确性」（是否满足质量要求）'] },
    { t: '变更控制 vs 配置控制', c: ['变更控制：识别、记录、批准/否决对项目文件、可交付成果或基准的变更', '配置控制：关注可交付成果及过程的技术规范'] },
    { t: '资源平衡 vs 资源平滑', c: ['资源平衡：通常导致关键路径改变（往往是延长）', '资源平滑：不改变关键路径、完工日期不延迟'] },
    { t: '赶工 vs 快速跟进', c: ['赶工：增加资源压缩关键路径活动工期（可能增加成本/风险）', '快速跟进：把顺序活动改为至少部分并行（可能返工）'] },
    { t: '威胁策略 vs 机会策略', c: ['威胁：上报、规避、转移、减轻、接受', '机会：上报、开拓、分享、提高、接受'] },
    { t: '管理质量 vs 控制质量', c: ['管理质量（质量保证）：关注过程，质量审计、过程分析', '控制质量：关注可交付成果，检查、测试、核实'] },
    { t: '应急储备 vs 管理储备', c: ['应急储备：应对「已识别」风险，计入成本基准', '管理储备：应对「未识别」风险，不计入成本基准、计入项目预算'] },
    { t: '成本基准 vs 项目预算', c: ['成本基准：经批准、按时间段分配，不含管理储备', '项目预算 = 成本基准 + 管理储备'] },
    { t: '工作绩效数据/信息/报告', c: ['数据：执行中收集的原始数据（指导与管理项目工作产出）', '信息：各控制过程提炼（反映偏差）', '报告：监控项目工作产出，供干系人决策'] },
    { t: '风险 vs 问题', c: ['风险：未来可能发生的不确定事件（概率×影响）', '问题：已经发生的、需要解决的事项（问题日志）'] }
  ];

  function buildTree(){
    var root = { t: '系统集成项目管理工程师（第3版）', root: true, c: [] };
    root.c.push({ t: '🔗 跨章主线（把知识串起来）', c: CHAINS.map(function(ch){ return { t: ch.t, c: ch.c.map(function(x){ return { t: '🎯 ' + x }; }) }; }) });
    root.c.push({ t: '⚖️ 高频辨析（对比记忆）', c: DISPUTES.map(function(d){ return { t: d.t, c: d.c.map(function(x){ return { t: '🎯 ' + x }; }) }; }) });
    D.modules.forEach(function(m){
      var mn = { t: m.title + '（' + m.range + '）', c: [] };
      m.chapters.forEach(function(ch){
        var cn = { t: '第' + ch.num + '章 ' + ch.title, c: [] };
        (ch.map || []).forEach(function(mi){
          var mm = (mi.t || '').match(/\(([^)]+)\)/);
          var secNum = mm ? mm[1] : null;
          var sec = null;
          if(secNum){
            sec = (ch.sections || []).find(function(s){ return s.num === secNum; });
            if(!sec){
              var rm = secNum.match(/^(\d+\.\d+)-/); // 形如 11.2-11.5 的范围
              var key = rm ? rm[1] : secNum;
              sec = (ch.sections || []).find(function(s){ return s.num === key; })
                 || (ch.sections || []).find(function(s){ return s.num.indexOf(key + '.') === 0; });
            }
            if(!sec){
              // 再尝试把范围两端都拆开，取第一段
              var first = secNum.split('-')[0];
              sec = (ch.sections || []).find(function(s){ return s.num === first; })
                 || (ch.sections || []).find(function(s){ return s.num.indexOf(first + '.') === 0; });
            }
          }
          var detail = sec ? renderDetail(sec, ch) : ('<div class="dt-h">📍 第' + ch.num + '章 ' + esc(ch.title) + ' · 本章总览</div>' + md(ch.authorLogic || '') + (ch.authorLogic ? '' : '<div class="md-p">（本章内容见章节页）</div>'));
          cn.c.push({ t: mi.t, c: (mi.c || []).map(function(x){ return { t: '🎯 ' + x, detail: detail }; }) });
        });
        var ms = (ch.sections || []).filter(function(s){ return s.memorize; });
        if(ms.length){
          cn.c.push({ t: '💡 记忆技巧', c: ms.map(function(s){ return { t: '🧠 ' + s.num + ' ' + s.title + '：' + s.memorize, detail: renderDetail(s, ch) }; }) });
        }
        mn.c.push(cn);
      });
      root.c.push(mn);
    });
    return root;
  }

  var OPEN_DEPTH = 2; // 0=根 1=模块 2=章 3=主题 4=叶子

  function renderNode(node, depth){
    var hasKids = node.c && node.c.length;
    var hasDetail = !hasKids && node.detail;
    var open = depth < OPEN_DEPTH;
    var h = '<div class="nd">';
    h += '<div class="lbl ' + (hasKids ? 'branch' : 'leaf') + (hasDetail ? ' has-detail' : '') + (node.root ? ' root' : '') + '" data-d="' + depth + '">';
    h += '<span class="tg' + (hasKids ? '' : (hasDetail ? '' : ' leafdot')) + '">' + (hasKids ? (open ? '▾' : '▸') : (hasDetail ? '▸' : '●')) + '</span>';
    h += '<span class="txt">' + esc(node.t) + '</span>';
    h += '</div>';
    if(hasKids){
      h += '<div class="kids" style="display:' + (open ? 'block' : 'none') + '">';
      node.c.forEach(function(ch){ h += renderNode(ch, depth + 1); });
      h += '</div>';
    } else if(hasDetail){
      h += '<div class="dt" style="display:none">' + node.detail + '</div>';
    }
    return h + '</div>';
  }

  var tree = buildTree();
  var container = document.getElementById('tree');
  container.innerHTML = renderNode(tree, 0);

  container.addEventListener('click', function(e){
    var lbl = e.target.closest('.lbl');
    if(!lbl) return;
    var nxt = lbl.nextElementSibling;
    if(!nxt) return;
    if(nxt.classList.contains('kids')){
      var open = nxt.style.display !== 'none';
      nxt.style.display = open ? 'none' : 'block';
      var tg = lbl.querySelector('.tg'); if(tg) tg.textContent = open ? '▸' : '▾';
    } else if(nxt.classList.contains('dt')){
      var show = nxt.style.display === 'none';
      nxt.style.display = show ? 'block' : 'none';
      var tg2 = lbl.querySelector('.tg'); if(tg2) tg2.textContent = show ? '▾' : '▸';
    }
  });

  window.expandAll = function(){
    container.querySelectorAll('.kids').forEach(function(k){ k.style.display = 'block'; });
    container.querySelectorAll('.lbl.branch .tg').forEach(function(t){ t.textContent = '▾'; });
  };
  window.collapseAll = function(){
    container.querySelectorAll('.kids').forEach(function(k){ k.style.display = 'none'; });
    container.querySelectorAll('.lbl.branch .tg').forEach(function(t){ t.textContent = '▸'; });
  };
})();
</script>
</body>
</html>
